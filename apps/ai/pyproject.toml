[project]
name = "legal-saas-ai"
version = "0.0.0"
description = "Servicio FastAPI para clasificación de intención y resúmenes con Anthropic Claude."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.39",
    "pydantic>=2.9",
    "httpx>=0.27",
    "redis>=5.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # allow asserts in tests

[tool.mypy]
strict = true
python_version = "3.12"

# NOTA: Issue #8 de BACKLOG.md scaffoldea este servicio.
# Sigue SETUP.md sección 6 con `uv init` o `pip install -e ".[dev]"`.
