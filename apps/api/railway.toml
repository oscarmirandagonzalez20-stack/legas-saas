[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Migrations run as a pre-deploy step. node_modules/.bin/prisma is a #!/bin/sh
# wrapper — calling `node` on it causes SyntaxError. Call the JS entry point directly.
predeploy = "node node_modules/prisma/build/index.js migrate deploy"
healthcheckPath = "/salud"
healthcheckTimeout = 300
