[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Migrations run in a pre-deploy step: Railway starts this in the new container
# before routing traffic to it. If it fails, the old deployment stays active.
# Uses `node` explicitly to avoid relying on executable bits or PATH lookups.
predeploy = "node node_modules/.bin/prisma migrate deploy"
healthcheckPath = "/health"
healthcheckTimeout = 300
